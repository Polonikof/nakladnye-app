name: Сборка Накладные.exe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Собрать exe
        run: python -m PyInstaller --noconfirm --clean nakladnye.spec

      - name: Имя файла для скачивания
        shell: pwsh
        run: |
          Copy-Item -Force "dist\Накладные.exe" "dist\Nakladnye.exe"
          Get-Item "dist\Nakladnye.exe" | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Nakladnye
          path: dist/Nakladnye.exe

      - name: Выложить в GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Nakladnye.exe
          name: Накладные ${{ github.ref_name }}
          body: |
            Версия 1.5: после «Обучить» появляется архив
            Накладные_1.5.1_для_сотрудника.zip — его можно сразу
            отправить коллеге (внутри Накладные.exe и справочники).

            Если исходник тот же, а готовый файл другой,
            правила этого типа накладных перезаписываются.

            Как поставить:
            1. Скачайте Nakladnye.exe
            2. Закройте старую программу
            3. Замените C:\Накладные\Накладные.exe этим файлом
            4. Откройте — в окне v1.5

            Обучить: два файла в C:\Накладные\НовыеНакладные
            → Накладные_1.5.1.exe (вам) и zip для сотрудника.
          fail_on_unmatched_files: true
