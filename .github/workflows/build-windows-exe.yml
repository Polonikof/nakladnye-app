name: Сборка Накладные.exe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Собрать exe
        run: python -m PyInstaller --noconfirm --clean nakladnye.spec

      - name: Имя файла для скачивания
        shell: pwsh
        run: |
          Copy-Item -Force "dist\Накладные.exe" "dist\Nakladnye.exe"
          Get-Item "dist\Nakladnye.exe" | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Nakladnye
          path: dist/Nakladnye.exe

      - name: Выложить в GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Nakladnye.exe
          name: Накладные ${{ github.ref_name }}
          body: |
            Версия 1.3: Витебск, Обои и packing list Юсуф.
            После обучения программа сама кладёт новый файл
            Накладные_1.3.1.exe (номер растёт).

            Как поставить:
            1. Скачайте Nakladnye.exe
            2. Закройте старую программу
            3. Замените C:\Накладные\Накладные.exe этим файлом
            4. Откройте — в окне v1.3, три вида накладных и кнопка «Обучить»

            Обработать файлы: .xls Витебск, УПД обоев, packing list Юсуф
            в C:\Накладные.

            Обучить: два файла (исходник + готовый) в
            C:\Накладные\НовыеНакладные → появится Накладные_1.3.1.exe.
            Закройте старое окно и откройте новый файл.
          fail_on_unmatched_files: true
